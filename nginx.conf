server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for maximum performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/manifest+json
        image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Never cache dynamic assets (HTML, CSS, JS, JSON/Manifest, Service Worker)
    # This guarantees that docker rebuilds and updates are immediately visible!
    location ~* \.(html|css|js|json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    }

    # Static Media & Icons Caching (images can still be cached)
    location ~* \.(svg|png|jpg|jpeg|ico|webp)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # SPA / Static Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
